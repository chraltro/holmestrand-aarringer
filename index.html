<!doctype html>
<html lang="no">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Holmestrand og Rove vokser frem bygning for bygning, med jernbaner og veier som kommer og går.">
<title>Holmestrands årringer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700;800&family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: the city as a printed atlas plate on kraft paper. Old buildings are dark like the heartwood of a tree, new ones green like
   the living rings under the bark, buildings going up are marked in survey red. Label card top-left (city, year, counts, key), search
   and view menu top-right, notes bottom-left, the timeline along the bottom edge. Panels are framed by a hairline, not floated on shadows. */
:root {
  color-scheme: light;
  --table: #d3cab6;      /* kraft paper under the plate */
  --paper: #f7f2e7;
  --paper-2: #ebe3d2;
  --ink: #2a221d;
  --ink-2: #6b6157;
  --hair: rgba(42, 34, 29, 0.2);
  --build: #c23b22;      /* going up: survey red */
  --foam: #2f6b4f;       /* newly built: the green of new growth */
  --f: "Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
  --serif: "Alegreya", Georgia, serif;
  --sc: "Alegreya SC", Georgia, serif;
  --lift: 0 0 0 1px rgba(42, 34, 29, 0.24);
}
html, body { height: 100%; }
body { margin: 0; background: var(--table); color: var(--ink); font: 14.5px/1.4 var(--f); font-variant-numeric: lining-nums; overflow: hidden; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }

.top { position: fixed; z-index: 6; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.top > * { pointer-events: auto; }
.plate { background: var(--paper); box-shadow: var(--lift); padding: 12px 16px 14px; width: 270px; box-sizing: border-box; display: grid; gap: 2px; min-width: 0; }
.plate-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12.5px; }
.brand { font-family: var(--sc); font-weight: 700; font-size: 14px; letter-spacing: 0.05em; }
.cities { display: flex; gap: 10px; }
.cities button { background: none; border: 0; padding: 0 0 1px; color: var(--ink-2); font-weight: 500; font-size: 12.5px; border-bottom: 1.5px solid transparent; }
.cities button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }
.one-city { font-weight: 700; font-size: 12.5px; }
.year-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.year { font-family: var(--serif); font-size: 84px; font-weight: 800; line-height: 0.9; letter-spacing: -0.02em; font-variant-numeric: lining-nums tabular-nums; margin: 8px 0 4px; }
.fold { flex: none; width: 30px; height: 30px; margin: 6px -8px 0 0; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--ink-2); }
.fold:hover { color: var(--ink); }
.fold svg { width: 14px; height: 14px; transition: transform 0.2s; }
/* folded: the plate keeps only the year */
.plate.mini { width: auto; padding: 6px 8px 6px 14px; }
.plate.mini .plate-head, .plate.mini .live, .plate.mini .facts, .plate.mini .key { display: none; }
.plate.mini .year { font-size: 44px; margin: 2px 0 0; cursor: pointer; }
.plate.mini .fold { margin: 2px -2px 0 0; }
.plate.mini .fold svg { transform: rotate(180deg); }
.live { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.playing .live { min-height: 17px; }
.live b { color: var(--ink); font-weight: 700; }
.facts { display: grid; gap: 1px; font-size: 13.5px; font-variant-numeric: lining-nums tabular-nums; margin-top: 4px; }
.facts span { color: var(--ink-2); }
.key { margin-top: 10px; display: grid; gap: 5px; font-size: 11.5px; color: var(--ink-2); }
.key-row { display: flex; align-items: center; gap: 7px; }
.sw { width: 11px; height: 11px; flex: none; }
.ramp { height: 8px; }
.ramp-ticks { position: relative; height: 13px; font-variant-numeric: lining-nums tabular-nums; }
.ramp-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ramp-ticks span:first-child { transform: none; }
.ramp-ticks span:last-child { transform: translateX(-100%); }
.cats { display: grid; grid-template-columns: 1fr; gap: 4px; }
.cats.two { grid-template-columns: 1fr 1fr; column-gap: 10px; }
.key-h { font-family: var(--sc); font-size: 12.5px; letter-spacing: 0.04em; color: var(--ink-2); margin-top: 4px; }

.tools { display: flex; gap: 8px; align-items: flex-start; position: relative; }
.search { position: relative; }
.search input { width: 240px; height: 38px; box-sizing: border-box; border: 0; border-radius: 0; background: var(--paper); box-shadow: var(--lift);
  padding: 0 12px 0 34px; font-size: 13.5px; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search svg { position: absolute; left: 11px; top: 11px; width: 16px; height: 16px; pointer-events: none; }
.results { position: absolute; left: 0; top: 46px; width: var(--tools-w, 320px); max-width: calc(100vw - 32px); box-sizing: border-box; background: var(--paper); box-shadow: var(--lift);
  margin: 0; padding: 4px 0; list-style: none; max-height: 330px; overflow: auto; }
.results li { padding: 7px 12px; display: flex; justify-content: space-between; gap: 12px; cursor: pointer; font-size: 13.5px; }
.results li[aria-selected="true"], .results li:hover { background: var(--paper-2); }
.results li span { color: var(--ink-2); font-variant-numeric: lining-nums tabular-nums; flex: none; }
.results .none { color: var(--ink-2); cursor: default; }
.btn { height: 38px; padding: 0 14px; border: 0; background: var(--paper); box-shadow: var(--lift); font-weight: 700; font-size: 13px; }
.btn[aria-expanded="true"] { background: var(--ink); color: var(--paper); }
.menu { position: absolute; left: 0; right: 0; top: 46px; background: var(--paper); box-shadow: var(--lift); padding: 12px; display: grid; gap: 11px; font-size: 13px; }
.lbl { color: var(--ink-2); font-size: 11.5px; margin-bottom: 4px; }
.seg { display: flex; border: 1px solid var(--ink); }
.seg button { flex: 1; background: none; border: 0; border-left: 1px solid var(--ink); padding: 6px 4px; font-size: 12.5px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
.check input { margin: 0; accent-color: var(--ink); width: 15px; height: 15px; flex: none; }
.link { background: none; border: 0; padding: 0; text-align: left; text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

.bar { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; background: var(--paper); box-shadow: 0 -1px 0 rgba(42, 34, 29, 0.24);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; align-items: center; gap: 12px; }
.play { flex: none; width: 42px; height: 42px; border: 0; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.play svg { width: 15px; height: 15px; fill: currentColor; }
.scrub { position: relative; flex: 1; min-width: 0; height: 54px; }
.scrub svg { position: absolute; left: 0; top: 10px; width: 100%; height: 28px; overflow: visible; }
.scrub input { position: absolute; left: 0; right: 0; top: 8px; width: 100%; height: 46px; margin: 0; opacity: 0; cursor: ew-resize; }
.ticks { position: absolute; left: 0; right: 0; top: 41px; height: 13px; font-size: 10.5px; color: var(--ink-2); font-variant-numeric: lining-nums tabular-nums; pointer-events: none; }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.chaps { position: absolute; left: 0; right: 0; top: 0; height: 9px; }
.chap { position: absolute; top: -3px; width: 16px; height: 14px; margin-left: -8px; border: 0; background: none; padding: 0; }
.chap::after { content: ""; position: absolute; inset: -6px -4px; }   /* a 24 px target around the small diamond */
.scrub:has(#range:focus-visible) { outline: 2px solid var(--ink); outline-offset: 4px; }
.chap::before { content: ""; position: absolute; left: 5px; top: 4px; width: 6px; height: 6px; background: var(--ink-2); transform: rotate(45deg); }
.chap.seen::before { background: var(--ink); }
.chap.now::before { background: var(--build); }
.hovery { position: absolute; bottom: 52px; transform: translateX(-50%); background: var(--ink); color: var(--paper); font-size: 11.5px; padding: 3px 7px;
  font-variant-numeric: lining-nums tabular-nums; pointer-events: none; white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
.pill { flex: none; height: 42px; min-width: 44px; padding: 0 12px; border: 1px solid var(--ink); background: none; font-weight: 700; font-size: 13px; font-variant-numeric: lining-nums tabular-nums; }
.pill.toggle { display: flex; align-items: center; gap: 7px; }
.pill.toggle::before { content: ""; width: 9px; height: 9px; box-sizing: border-box; border: 1.5px solid var(--ink); }
.pill.toggle[aria-pressed="true"]::before { background: var(--build); border-color: var(--build); }

.caption, .intro { position: fixed; z-index: 3; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
  width: min(430px, calc(100vw - 32px)); box-sizing: border-box; background: var(--paper); box-shadow: var(--lift); }
.caption { padding: 11px 14px 12px; display: grid; gap: 3px; transition: opacity 0.35s, transform 0.35s; }
.caption.out { opacity: 0; transform: translateY(6px); pointer-events: none; }
.caption .x, .intro .x { position: absolute; top: 4px; right: 4px; border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; color: var(--ink); }
.cap-y, .caption p, .intro h2 { padding-right: 28px; }
.cap-y { font-family: var(--sc); font-weight: 700; font-size: 14px; letter-spacing: 0.04em; font-variant-numeric: lining-nums tabular-nums; color: var(--build); }
.caption p { margin: 0; font-size: 14px; line-height: 1.45; }
.cap-off { justify-self: start; margin-top: 4px; font-size: 12px; color: var(--ink-2); }
.toast { position: fixed; z-index: 8; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); width: max-content; max-width: calc(100vw - 32px);
  box-sizing: border-box; background: var(--ink); color: var(--paper); padding: 10px 14px; display: flex; gap: 14px; align-items: baseline; font-size: 13px; box-shadow: var(--lift); }
.toast .link { color: var(--paper); font-weight: 700; flex: none; }
.intro { z-index: 5; padding: 18px 18px 16px; display: grid; gap: 8px; }
.intro h2 { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 800; line-height: 1.15; text-wrap: balance; }
.intro p { margin: 0; font-size: 14.5px; line-height: 1.45; max-width: 46ch; }
.intro-actions { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.primary { position: relative; overflow: hidden; height: 42px; padding: 0 18px; border: 0; background: var(--ink); color: var(--paper); font-weight: 700; }
.primary i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--build); width: 0; }
.secondary { height: 42px; padding: 0 14px; border: 1px solid var(--ink); background: none; font-weight: 700; }

.card { position: fixed; z-index: 5; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 62px);
  width: var(--tools-w, 300px); max-width: calc(100vw - 32px); box-sizing: border-box; background: var(--paper); box-shadow: var(--lift); padding: 14px 16px 16px; display: grid; gap: 4px; }
.card .x { position: absolute; top: 6px; right: 6px; border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; }
.card-k { font-family: var(--sc); font-size: 13px; letter-spacing: 0.06em; color: var(--ink-2); font-weight: 700; padding-right: 28px; }
.card h2 { margin: 0; font-family: var(--serif); font-size: 21px; font-weight: 800; line-height: 1.2; padding-right: 28px; text-wrap: balance; }
.card-y { font-family: var(--serif); font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: lining-nums tabular-nums; margin: 6px 0 2px; }
.card-w { margin: 0 0 2px; font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
.card dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.card dt { color: var(--ink-2); }
.card dd { margin: 0; min-width: 0; }
.card-f { margin: 8px 0 0; padding-top: 9px; border-top: 1px solid var(--hair); font-size: 13px; line-height: 1.45; }

.tip { position: fixed; left: 0; top: 0; z-index: 7; pointer-events: none; background: var(--ink); color: var(--paper); padding: 6px 9px; font-size: 12.5px; display: grid; gap: 1px; max-width: 260px; }
.tip span { opacity: 0.75; font-variant-numeric: lining-nums tabular-nums; }

.labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.lm { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: flex-start; opacity: 0; transition: opacity 0.45s; will-change: transform; }
.lm.on { opacity: 1; }
.lm b { font-family: var(--serif); font-size: 13.5px; font-weight: 700; white-space: nowrap; padding-left: 5px; text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 2px var(--paper); }
.lm.fresh b { color: var(--build); }
.lm i { width: 1px; height: 26px; background: var(--ink); }
.hl { position: absolute; left: 0; top: 0; white-space: nowrap; color: var(--ink-2); opacity: 0; transition: opacity 0.4s; will-change: transform;
  text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 2px var(--paper); }
.hl.on { opacity: 1; }
.hl.l1 { font-family: var(--sc); font-size: 14px; font-weight: 700; letter-spacing: 0.12em; color: var(--ink); }
.hl.l2 { font-family: var(--serif); font-size: 12.5px; font-weight: 500; }
.hl.l1.plain { font-family: var(--serif); letter-spacing: 0.02em; font-size: 14px; }
.hl.sl { font-family: var(--serif); font-size: 12.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.hl.sl.fresh { color: var(--build); }
.hl.sl i, .key .hsw { width: 18px; height: 4px; flex: none; }
.hl.sl.rail i, .key .hsw.rail { background: repeating-linear-gradient(90deg, #2a221d 0 5px, #fbf8f0 5px 10px); box-shadow: 0 0 0 1px #2a221d; height: 2px; }
.hl.sl.road i, .key .hsw.road { background: #c46f2a; box-shadow: 0 0 0 1px #2a221d; height: 3px; }
.hl.sl.tun i { background: repeating-linear-gradient(90deg, #2a221d 0 4px, transparent 4px 7px); box-shadow: none; height: 2px; }
.hl.sl.road.tun i { background: repeating-linear-gradient(90deg, #c46f2a 0 4px, transparent 4px 7px); height: 3px; }

.north { position: fixed; z-index: 3; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 94px); width: 34px; height: 34px; pointer-events: none; }
.north svg { width: 100%; height: 100%; overflow: visible; }

.sheet { position: fixed; z-index: 8; inset: 0; display: grid; place-items: center; background: rgba(42, 34, 29, 0.3);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.sheet-in { position: relative; width: min(580px, 100%); max-height: min(82vh, 760px); overflow: auto; box-sizing: border-box; background: var(--paper);
  box-shadow: var(--lift); padding: 20px 22px 8px; font-size: 14px; line-height: 1.55; }
.sheet h2 { margin: 0 0 10px; font-family: var(--serif); font-size: 22px; font-weight: 800; padding-right: 28px; }
.sheet p { margin: 0 0 12px; max-width: 64ch; }
.sheet a { color: var(--ink); }
.sheet .nw { white-space: nowrap; }
.sheet h3 { margin: 18px 0 6px; font-family: var(--serif); font-size: 15.5px; font-weight: 800; }
.sheet ul { margin: 0 0 6px; padding-left: 18px; max-width: 64ch; }
.sheet li { margin: 0 0 6px; }
.sheet .lic { color: var(--ink-2); font-size: 12px; white-space: nowrap; }
#src-pill { display: none; }
.sheet .x { position: absolute; top: 8px; right: 8px; border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 8px; }

.loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--table); transition: opacity 0.5s; }
.loading.done { opacity: 0; pointer-events: none; }
.load-box { width: min(320px, calc(100vw - 32px)); display: grid; gap: 9px; }
.load-t { font-family: var(--serif); font-weight: 800; font-size: 24px; line-height: 1.15; }
.load-s { font-size: 13px; color: var(--ink-2); font-variant-numeric: lining-nums tabular-nums; }
.load-bar { height: 3px; background: rgba(42, 34, 29, 0.15); }
.load-bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 0.15s; }
.load-bar { overflow: hidden; }
.load-bar i.indet { width: 30% !important; animation: indet 1.3s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.load-retry { justify-self: start; margin-top: 6px; }

@media (max-width: 700px) {
  .plate { width: 196px; padding: 9px 11px 10px; }
  .plate-head { font-size: 11.5px; }
  .cities button, .one-city { font-size: 11.5px; }
  .brand { display: none; }
  .year { font-size: 50px; margin: 5px 0 2px; }
  .plate.mini { padding: 4px 6px 4px 11px; }
  .plate.mini .year { font-size: 34px; }
  .fold { width: 28px; height: 28px; margin: 2px -6px 0 0; }
  .toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 116px); }
  .live { font-size: 11.5px; }
  .facts { font-size: 12px; }
  .key { margin-top: 7px; font-size: 10.5px; gap: 3px; }
  .cats { grid-template-columns: 1fr; gap: 2px; }
  body.carded .plate .live, body.carded .plate .facts, body.carded .plate .key { display: none; }
  .search { width: 38px; height: 38px; }
  .search input { position: absolute; right: 0; top: 0; width: 38px; padding: 0; color: transparent; cursor: pointer; z-index: 1; }
  .search svg { z-index: 2; }
  .search input::placeholder { color: transparent; }
  /* while searching, the field takes the whole top row */
  body.searching .plate, body.searching #menu-btn, body.searching #menu { visibility: hidden; }
  .search:focus-within input { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    width: auto; padding: 0 12px 0 36px; color: var(--ink); cursor: text; font-size: 16px; }
  .search:focus-within svg { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 27px); left: calc(max(16px, env(safe-area-inset-left, 0px)) + 12px); }
  .search:focus-within input::placeholder { color: var(--ink-2); }
  .results { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-width: none;
    top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 7; }
  .menu { position: fixed; top: auto; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); }
  body.playing .live { min-height: 16px; }
  .bar { flex-wrap: wrap; row-gap: 8px; column-gap: 8px; padding-block: 6px calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .scrub { order: -1; flex-basis: 100%; height: 56px; }
  #src-btn { display: none; }
  #src-pill { display: inline-block; }
  .play { width: 40px; height: 40px; }
  .pill { height: 40px; }
  .spacer { flex: 1; }
  .caption, .intro { bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); }
  .intro h2 { font-size: 20px; }
  .intro p { font-size: 13.5px; }
  /* the card becomes a compact sheet: address and year on one row, the facts as one running line */
  .card { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 128px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-width: none;
    grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; row-gap: 3px; padding: 11px 14px 13px; }
  .card-k, .card-w, .card dl, .card-f { grid-column: 1 / -1; }
  .card-k { min-height: 16px; }
  .card h2 { grid-column: 1; grid-row: 2; align-self: end; font-size: 17px; padding-right: 0; }
  .card-y { grid-column: 2; grid-row: 2; align-self: end; font-size: 28px; margin: 0; }
  .card dl { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.5; }
  .card dt, .card dd { display: inline; }

<template id="about-hol-no"><h2 id="sheet-h">Om dataene og kildene</h2>
<p>Modellen viser Holmestrand under fjellet og boligområdene på platået over, fra Rove og Sommerro til Hvitstein og Neperud. Tre av fem bygninger er grå. Matrikkelen har byggeår for alle bygninger, men feltet er ikke med i noen åpen utgave. Av rundt 3&nbsp;140 bygninger har 1&nbsp;247 et år fra andre kilder, 306 av dem anslått ut fra bygningsnummeret. De grå reiser seg til slutt.</p>
<p>Årene kommer fra disse kildene.</p>
<p><b>SEFRAK.</b> <a href="https://api.ra.no/KulturminnerSEFRAKbygninger" target="_blank" rel="noopener">Riksantikvarens register over hus fra før 1900</a> (NLOD) daterer husene til et kvart eller et helt århundre. 163 bygninger har en slik datering og reiser seg et sted i sin periode. Kortet viser perioden, ikke et år. 24 hus står i SEFRAK uten datering og reiser seg samlet i 1899. I fargevisningen Alder har de sin egen farge.</p>
<p><b>Energiattester.</b> <a href="https://data.norge.no/en/datasets/6e841199-64b4-36d4-afd2-3d8054e2f96c" target="_blank" rel="noopener">Enovas register over energiattester</a> (NLOD) gir år for 597 bygninger, koblet via bygningsnummer. En attest må lages når en bolig selges eller leies ut, så det er mest boliger. Er attestene for en bygning uenige, brukes året flest oppgir. For nye bygninger der Kartverket også har et år, er de to høyst ett år fra hverandre i 65 av 66 tilfeller. For gamle hus er attestene ofte for unge: av 43 SEFRAK-hus med attest ligger bare 10 innenfor SEFRAKs periode, så der brukes SEFRAK.</p>
<p><b>Kartverkets årlige utdrag.</b> Kartverket publiserer et utdrag av Matrikkelen hver desember (2019 til 2025). En bygning som går fra igangsatt til ferdig mellom to utdrag, regnes som ferdig det året, 85 i alt. Oktober 2026 er fra Matrikkelens åpne bygningspunkter. Utdraget fra 2022 mangler en del bygninger, så noen står som ferdige 2022–2023. Åtte bygninger til fikk nummeret etter ett utdrag og er ferdige i det neste, og regnes også som ferdige det året.</p>
<p><b>Bygningsnummeret.</b> Matrikkelen gir en ny bygning det neste nummeret når saken registreres, og nummeret er åpent. Bygninger med nabonumre ble derfor bygget omtrent samtidig, så lenge de er registrert enkeltvis og ikke lagt inn samlet, noe Matrikkelens åpne data også viser. For en bygning uten år ser modellen på de åtte nærmeste numrene i hele Holmestrand kommune som har et kjent år fra energiattester eller Kartverkets utdrag. Er de enige innen to år, får bygningen midtverdien og reiser seg et sted i årene rundt, og kortet sier «ca.». Det gjelder 306 bygninger, to av tre av dem garasjer og uthus. Metoden er prøvd på bygningene med kjent år, ved å late som om året manglet: ni av ti anslag treffer innen ett år, 96 prosent innen to år, og 2 prosent bommer med mer enn fem år, oftest fordi et eldre hus fikk nummer sent. Den brukes bare for de to nummerseriene der rekkefølgen holder: den nasjonale serien fra 2009 og Holmestrands egen serie fra slutten av 1990-tallet. Den eldre serien fra 1980- og 90-tallet blander inn for mange eldre hus og er ikke brukt. En stikkprøve på ni boliger med anslått år, slått opp på Hjemla, ga åtte innen ett år og én som bommet med seks år. Den har nå året fra Hjemla. Overflatemodellen (se høyder under) er en kontroll. Den viser alle bygningene i modellen som ble ferdige i 2021, men nesten ingen fra 2022, så et anslag til 2020 eller tidligere for en bygning den ikke viser, eller til 2023 eller senere for en bygning den viser, er forkastet.</p>
<p><b>Eldre enn registeret.</b> 1&nbsp;217 av de grå ble lagt inn i registeret samlet, sammen med husene som allerede sto da det ble bygd opp. Av slike hus med energiattest er 96 prosent bygget i 1983 eller før, og kortet sier det. De reiser seg likevel til slutt, siden året er ukjent.</p>
<p><b>Kjente bygg.</b> Holmestrand kirke (1674), Holstgården (1756), Fattighuset (1760), Backergården (1806), det gamle rådhuset (1864), Jernbanesmia (1880), Kullboden (1910) og rådhuset fra 1964 har år fra Holmestrand kommunes <a href="https://holmestrand.kommune.no/_f/p1/i9f9d81cc-54eb-4b27-8b04-b99c7a9b8652/kulturloype-holmestrand-sentrum-nord.pdf" target="_blank" rel="noopener">kulturløype for sentrum nord</a>. Inngangen til stasjonen i fjellet har år fra OpenStreetMap.</p>
<p><b>Funnet for hånd.</b> For de største og viktigste bygningene uten år er årstallet søkt opp ett for ett, og kortet sier hvor det kommer fra. Det gjelder blant annet Ekeberg skole og flerbrukshallen, Gjøklep ungdomsskole, sykehjemmet og omsorgsboligene på Rove, Gausetangen og Gaupås barnehager, Borgen forsamlingslokale, «Casino» fra den tyske Grefsrud leir, Telebygget, Filadelfiakirken og Botne menighets bedehus, Fibo-fabrikken på Ekelund, høydebassenget ved Ekebergveien, Esso-stasjonen og Glassmagasinet i Langgaten, borettslagene i Barlinveien, på Bilet og i Hagemannsskogen, Plantasjen, kornsiloen og renseanlegget. Kildene er Holmestrand kommune (blant annet <a href="https://holmestrand.kommune.no/_f/p1/i46dcabfa-78d6-4f21-9e54-bdaba9fb16a9/kpa-vedlegg-6-kulturminner-og-miljoer-kst-190624.pdf" target="_blank" rel="noopener">kulturminneplanen</a>), Wikipedia, Store norske leksikon, eiendomsdata fra Hjemla for den enkelte adressen, salgsannonser på Finn, utbyggere og entreprenører, og lokalavisene i <a href="https://www.nb.no/search" target="_blank" rel="noopener">Nasjonalbibliotekets nettbibliotek</a>, mest Jarlsberg Avis. 51 bygninger har år på denne måten. Der kildene var uenige, eller ikke sa sikkert hvilket bygg de gjaldt, står bygningen fortsatt uten år.</p>
<p><b>Aluminiumsverket.</b> Verket i sentrum er ett stort bygg i Matrikkelen. Det ble etablert i 1919 og er bygget ut i mange omganger siden, blant annet med et nytt valseverk under krigen og en stor utbygging 1945–50, men ingen kilde sier hvilken hall som er fra når. Derfor reiser hele dagens anlegg seg i 1919, og kortet sier det. De mindre byggene rundt det og hallene på Vesthøy, der verket bygget lakkeringsanlegg og trådvalseverk fra 1960, står fortsatt uten år. Kilder: <a href="https://snl.no/Speira_Holmestrand" target="_blank" rel="noopener">Store norske leksikon</a> og <a href="https://vestfoldmuseene.no/aluminiummuseet/1945-1967" target="_blank" rel="noopener">Aluminiummuseet</a>.</p>
<p><b>Det nye rådhuset.</b> Rådhuset ved stasjonen åpnet i oktober 2026 og er for nytt for både OpenStreetMap og laserdataene. Formen er tegnet etter arkitektenes illustrasjoner (Spir Arkitekter for Bane NOR Eiendom): to murfløyer i fire etasjer ut fra fjellet, et parti langs fjellet mellom dem og Jernbanesmia foran gårdsrommet, der den søndre fløyen trapper ned til tre etasjer mot plassen. Størrelsen følger arealet, 5&nbsp;950&nbsp;m² på fire etasjer, og plasseringen Matrikkelens punkt for bygningen. Omrisset og høydene er altså omtrentlige. Kilder: <a href="https://holmestrand.kommune.no/nytt-radhus/" target="_blank" rel="noopener">Holmestrand kommune</a>, <a href="https://www.veidekke.com/investor-relations/company-disclosures/veidekke-new-city-hall-in-holmestrand/" target="_blank" rel="noopener">Veidekke</a> og <a href="https://byggfaktanyheter.no/nye-holmestrand-radhus-med-hoye-miljoambisjoner/" target="_blank" rel="noopener">Byggfakta</a>.</p>
<p><b>Stasjonen i fjellet.</b> Stasjonen ligger 150 meter inne i fjellet og åpnet 28. november 2016. Portalbyggene ved nordre og søndre inngang er tegnet etter overflatemodellen og arkitektenes bilder (<a href="https://gottliebpaludan.com/en/projects/holmestrand-station" target="_blank" rel="noopener">Gottlieb Paludan Architects</a>): et skrått betongtak som stiger mot den åpne portalen, med inngangen trukket inn under det. Stasjonshallen rundt de to plattformene og gangtunnelene fra inngangene, også den fra heisen opp til Rove, er tegnet stiplet fra åpningen, etter OpenStreetMap. Den søndre inngangen har året fra åpningen, heishuset på Rove står uten år. Kilder: <a href="https://en.wikipedia.org/wiki/Holmestrand_Station" target="_blank" rel="noopener">Wikipedia</a> og <a href="https://betong.net/wp-content/uploads/Vinner-2017-Holmestrand-st._Jury-begrunnelse.pdf" target="_blank" rel="noopener">juryen for Betongtavlen 2017</a>.</p>
<p><b>Den gamle stasjonen.</b> Stasjonen ved sjøen ble revet i 2016. Omrisset og årene 1881 og 2016 er fra OpenStreetMap, høyden er anslått. Den reiser seg i 1881 og synker i jorden igjen i 2016.</p>
<p>Omrissene er fra <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL) og koblet til Matrikkelen (<a href="https://wfs.geonorge.no/skwms1/wfs.matrikkelen-bygningspunkt?service=WFS&amp;request=GetCapabilities" target="_blank" rel="noopener">Kartverket, Bygningspunkt</a>) via bygningsnummer. Adresser er fra Matrikkelens adresseregister, bygningstyper fra <a href="https://www.ssb.no/klass/klassifikasjoner/31" target="_blank" rel="noopener">SSBs standard for bygningstype</a>.</p>
<p>Høyder, tak og terreng er fra Kartverkets nasjonale høydemodell (overflatemodell og terrengmodell, 1&nbsp;m, <a href="https://hoydedata.no" target="_blank" rel="noopener">hoydedata.no</a>, CC BY 4.0). Hver bygning står på det laveste punktet under omrisset sitt, og høyden er overflatemodellen innenfor omrisset. Der overflaten tydelig stiger mot en møne, er taket tegnet som saltak, valmtak eller pulttak, og vinkelhus er delt i fløyer. Det gjelder rundt 1&nbsp;470 bygninger. Store sammensatte bygninger, som aluminiumsverket, skoler og kjøpesentre, er delt opp i de delene taket faktisk har, så hver del får sin egen høyde. Det gjelder 32 bygninger. Rundt 100 bygninger finnes ikke i overflatemodellen, fordi de er nyere eller svært små, og har høyde anslått etter bygningstypen. Terrenget er lagt inn med 4&nbsp;m mellom punktene, med høydekurver for hver 5&nbsp;m.</p>
<p>Trærne er hver krone overflatemodellen viser utenfor husene, rundt 17&nbsp;000. En topp på minst 3&nbsp;m over bakken er et tre, og kronen er så bred som overflaten rundt toppen viser. Bar eller løv følger NIBIOs arealressurskart <a href="https://kartkatalog.geonorge.no/metadata/uuid/04b6aa8e-ac46-4303-baba-0149403a2acb" target="_blank" rel="noopener">AR50</a> (NLOD) i skogen, og ellers formen på kronen. Trær i skog og holt står fra begynnelsen, enkeltstående trær vokser fram når en firedel av husene innen 120&nbsp;m står.</p>
<p>Strøkene er SSBs grunnkretser (<a href="https://wfs.geonorge.no/skwms1/wfs.grunnkretser?service=WFS&amp;request=GetCapabilities" target="_blank" rel="noopener">Kartverket</a>), der de fem i sentrum er slått sammen. Noen navn er fra OpenStreetMap, som også har veiene, bryggene, jordene, parkene og plassene.</p>
<p><b>Spor og veier som var.</b> Linjene som kommer og går, er fra OpenStreetMap, der nedlagte jernbaner er kartlagt med datoer: Vestfoldbanen langs sjøen fra desember 1881 til oktober 2016 (strekningen sør for sentrum fikk ny trasé rundt 1980), Vittingfossbanen fra oktober 1902 til juni 1938, og den nye Vestfoldbanen i fjellet fra november 2016. Holmestrandtunnelen er tegnet stiplet fra 1983 til 2012. E18 gjennom byen er tegnet langs dagens fylkesvei 313 fra 1965, da Norge tok i bruk europaveinumrene, til tunnelen åpnet i 1983.</p>
<p>Innbyggertallet i platen og den stiplede linjen over tidslinjen er fra Statistisk sentralbyrå. Fra 1951 til 1963 er det bykommunen Holmestrand (tabell <a href="https://www.ssb.no/statbank/table/06913" target="_blank" rel="noopener">06913</a>). I 1964 ble Botne slått sammen med byen, og kommunen er ikke lenger byen alene, så linjen tar en pause. Fra 2000 er det tettstedet Holmestrand (tabell <a href="https://www.ssb.no/statbank/table/04859" target="_blank" rel="noopener">04859</a>), som dekker byen, Rove og boligområdene på platået. SSB endret hvordan tettsteder avgrenses i 2013.</p>
<p>Når lyden er slått på, er hver bygning som reiser seg, en tone. Høye bygninger låter dypere, kirker og kulturbygg er klokker, og en dyp tone blir sterkere når det bygges mye.</p>
<p>Historiske notater: Holmestrand kommune (kulturløypa), Store norske leksikon (<a href="https://snl.no/Holmestrand" target="_blank" rel="noopener">Holmestrand</a>, <a href="https://snl.no/Speira_Holmestrand" target="_blank" rel="noopener">Speira Holmestrand</a>, <a href="https://snl.no/europaveier" target="_blank" rel="noopener">europaveier</a>), Wikipedia (<a href="https://en.wikipedia.org/wiki/Holmestrand" target="_blank" rel="noopener">Holmestrand</a>, <a href="https://en.wikipedia.org/wiki/Holmestrand%E2%80%93Vittingfoss_Line" target="_blank" rel="noopener">Holmestrand–Vittingfoss Line</a>) og Teknisk Ukeblad (<a href="https://www.tu.no/artikler/holmestrand-sentrum-avlastes-for-annen-gang/436777" target="_blank" rel="noopener">Holmestrand sentrum avlastes for annen gang</a>).</p></template>
